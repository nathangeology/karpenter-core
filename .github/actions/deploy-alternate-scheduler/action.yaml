name: 'Deploy Alternate Scheduler'
description: 'Deploys an alternate kube-scheduler with MostAllocated strategy for benchmarking'
inputs:
  strategy:
    description: 'Scheduler strategy to deploy (LeastAllocated or MostAllocated)'
    required: true
    default: 'LeastAllocated'
runs:
  using: 'composite'
  steps:
    - name: Validate scheduler strategy
      shell: bash
      run: |
        if [[ "${{ inputs.strategy }}" != "LeastAllocated" && "${{ inputs.strategy }}" != "MostAllocated" ]]; then
          echo "❌ Invalid scheduler strategy: ${{ inputs.strategy }}"
          echo "Valid options are: LeastAllocated, MostAllocated"
          exit 1
        fi
        echo "✅ Using scheduler strategy: ${{ inputs.strategy }}"

    - name: Deploy alternate scheduler (MostAllocated only)
      if: inputs.strategy == 'MostAllocated'
      shell: bash
      run: |
        echo "🚀 Deploying MostAllocated scheduler..."
        
        # Validate scheduler configuration YAML syntax
        echo "📋 Validating scheduler configuration YAML syntax..."
        cat > /tmp/scheduler-config.yaml <<EOF
        apiVersion: kubescheduler.config.k8s.io/v1
        kind: KubeSchedulerConfiguration
        profiles:
        - schedulerName: most-allocated-scheduler
          pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                - name: cpu
                  weight: 1
                - name: memory
                  weight: 1
        EOF
        
        # Test YAML syntax using yq or python
        if command -v yq &> /dev/null; then
          if ! yq eval '.' /tmp/scheduler-config.yaml > /dev/null 2>&1; then
            echo "❌ Invalid scheduler configuration YAML syntax"
            exit 1
          fi
        elif command -v python3 &> /dev/null; then
          if ! python3 -c "import yaml; yaml.safe_load(open('/tmp/scheduler-config.yaml'))" > /dev/null 2>&1; then
            echo "❌ Invalid scheduler configuration YAML syntax"
            exit 1
          fi
        else
          echo "⚠️  Cannot validate YAML syntax (yq or python3 not available), proceeding..."
        fi
        echo "✅ Scheduler configuration YAML syntax is valid"
        
        # Create scheduler configuration
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: most-allocated-scheduler-config
          namespace: kube-system
        data:
          config.yaml: |
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
            - schedulerName: most-allocated-scheduler
              pluginConfig:
              - name: NodeResourcesFit
                args:
                  scoringStrategy:
                    type: MostAllocated
                    resources:
                    - name: cpu
                      weight: 1
                    - name: memory
                      weight: 1
        EOF

        # Create ServiceAccount (AlwaysAllow authorization will handle permissions)
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: most-allocated-scheduler
          namespace: kube-system
        EOF
        
        echo "ℹ️  Created ServiceAccount - AlwaysAllow authorization will handle permissions"

        # Get the Kubernetes version and determine scheduler image
        echo "🔍 Determining scheduler image..."
        
        # Get Kubernetes version from server
        K8S_VERSION=$(kubectl version --output=json 2>/dev/null | jq -r '.serverVersion.gitVersion' 2>/dev/null | sed 's/^v//' || echo "")
        
        # If we can't get the version, check what's running in the cluster
        if [[ -z "$K8S_VERSION" ]]; then
          echo "⚠️  Could not get K8s version from server, checking existing scheduler..."
          EXISTING_SCHEDULER_IMAGE=$(kubectl get pod -n kube-system -l component=kube-scheduler -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || echo "")
          if [[ -n "$EXISTING_SCHEDULER_IMAGE" ]]; then
            SCHEDULER_IMAGE="$EXISTING_SCHEDULER_IMAGE"
            echo "✅ Using same image as existing scheduler: $SCHEDULER_IMAGE"
          else
            # Fallback to a known working version
            SCHEDULER_IMAGE="registry.k8s.io/kube-scheduler:v1.31.0"
            echo "⚠️  Using fallback image: $SCHEDULER_IMAGE"
          fi
        else
          # Use the detected version
          SCHEDULER_IMAGE="registry.k8s.io/kube-scheduler:v${K8S_VERSION}"
          echo "✅ Using scheduler image for detected version: $SCHEDULER_IMAGE"
        fi

        # Deploy alternate scheduler with improved configuration
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: most-allocated-scheduler
          namespace: kube-system
          labels:
            app: most-allocated-scheduler
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: most-allocated-scheduler
          template:
            metadata:
              labels:
                app: most-allocated-scheduler
            spec:
              serviceAccountName: most-allocated-scheduler
              containers:
              - name: kube-scheduler
                image: $SCHEDULER_IMAGE
                command:
                - kube-scheduler
                - --config=/etc/kubernetes/scheduler-config.yaml
                - --v=2
                - --leader-elect=false
                - --bind-address=0.0.0.0
                - --secure-port=10260
                volumeMounts:
                - name: config
                  mountPath: /etc/kubernetes
                  readOnly: true
                # No resource requests/limits to avoid resource pressure in GitHub Actions environment
                # Let the scheduler share the host resources naturally
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 10260
                    scheme: HTTPS
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  httpGet:
                    path: /healthz
                    port: 10260
                    scheme: HTTPS
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
                startupProbe:
                  httpGet:
                    path: /healthz
                    port: 10260
                    scheme: HTTPS
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 10
              volumes:
              - name: config
                configMap:
                  name: most-allocated-scheduler-config
                  items:
                  - key: config.yaml
                    path: scheduler-config.yaml
              tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
              - key: node-role.kubernetes.io/master
                operator: Exists
                effect: NoSchedule
              - key: CriticalAddonsOnly
                operator: Exists
                effect: NoSchedule
              nodeSelector:
                node-role.kubernetes.io/control-plane: ""
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
        EOF

    - name: Wait for alternate scheduler to be ready
      if: inputs.strategy == 'MostAllocated'
      shell: bash
      run: |
        echo "⏳ Waiting for MostAllocated scheduler to be ready..."
        
        # Wait with better error handling
        if ! kubectl wait --for=condition=available --timeout=180s deployment/most-allocated-scheduler -n kube-system; then
          echo "❌ Scheduler deployment failed to become available. Debugging..."
          
          # Show deployment status
          echo "📊 Deployment status:"
          kubectl get deployment most-allocated-scheduler -n kube-system -o wide
          
          # Show pod status
          echo "📊 Pod status:"
          kubectl get pods -n kube-system -l app=most-allocated-scheduler -o wide
          
          # Show events
          echo "📊 Recent events:"
          kubectl get events -n kube-system --sort-by='.lastTimestamp' | tail -20
          
          # Show pod details if pod exists
          SCHEDULER_POD=$(kubectl get pods -n kube-system -l app=most-allocated-scheduler -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [[ -n "$SCHEDULER_POD" ]]; then
            echo "📊 Pod description:"
            kubectl describe pod "$SCHEDULER_POD" -n kube-system
            
            echo "📊 Pod logs:"
            kubectl logs "$SCHEDULER_POD" -n kube-system --tail=50 || echo "No logs available"
          fi
          
          exit 1
        fi
        
        # Verify scheduler is running
        kubectl get pods -n kube-system -l app=most-allocated-scheduler -o wide
        
        echo "✅ MostAllocated scheduler is ready!"

    - name: Verify scheduler configuration
      if: inputs.strategy == 'MostAllocated'
      shell: bash
      run: |
        echo "🔍 Verifying scheduler configuration..."
        
        # Wait a bit for scheduler to fully initialize
        sleep 10
        
        # Check if scheduler pod is running
        SCHEDULER_POD=$(kubectl get pods -n kube-system -l app=most-allocated-scheduler -o jsonpath='{.items[0].metadata.name}')
        if [[ -z "$SCHEDULER_POD" ]]; then
          echo "❌ No scheduler pod found"
          kubectl get pods -n kube-system -l app=most-allocated-scheduler
          exit 1
        fi
        
        echo "Scheduler pod: $SCHEDULER_POD"
        
        # Check pod status
        POD_STATUS=$(kubectl get pod "$SCHEDULER_POD" -n kube-system -o jsonpath='{.status.phase}')
        echo "Pod status: $POD_STATUS"
        
        if [[ "$POD_STATUS" != "Running" ]]; then
          echo "❌ Scheduler pod is not running"
          kubectl describe pod "$SCHEDULER_POD" -n kube-system
          kubectl logs "$SCHEDULER_POD" -n kube-system --tail=50 || echo "No logs available"
          exit 1
        fi
        
        # Check scheduler logs for successful startup
        echo "📋 Checking scheduler logs..."
        kubectl logs -n kube-system "$SCHEDULER_POD" --tail=30
        
        echo "✅ Scheduler deployment completed successfully!"
        echo "ℹ️  Skipping test pod validation - scheduler functionality will be validated by actual performance tests."

    - name: Skip deployment for LeastAllocated
      if: inputs.strategy == 'LeastAllocated'
      shell: bash
      run: |
        echo "ℹ️  Using default scheduler (LeastAllocated strategy)"
        echo "No alternate scheduler deployment needed."
