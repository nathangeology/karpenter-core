name: 'Configure Kubernetes Scheduler'
description: 'Configures the Kubernetes scheduler with the specified strategy'
inputs:
  strategy:
    description: 'Scheduler strategy to use (LeastAllocated or MostAllocated)'
    required: true
    default: 'LeastAllocated'
runs:
  using: 'composite'
  steps:
    - name: Validate scheduler strategy
      shell: bash
      run: |
        if [[ "${{ inputs.strategy }}" != "LeastAllocated" && "${{ inputs.strategy }}" != "MostAllocated" ]]; then
          echo "Error: Invalid scheduler strategy '${{ inputs.strategy }}'. Must be 'LeastAllocated' or 'MostAllocated'"
          exit 1
        fi
        echo "Configuring scheduler with strategy: ${{ inputs.strategy }}"

    - name: Prepare scheduler patches directory for Kind cluster
      shell: bash
      run: |
        STRATEGY_LOWER=$(echo "${{ inputs.strategy }}" | tr '[:upper:]' '[:lower:]')
        PATCHES_SOURCE="${{ github.action_path }}/patches/${STRATEGY_LOWER/leastallocated/least-allocated}"
        PATCHES_SOURCE="${PATCHES_SOURCE/mostallocated/most-allocated}"
        
        echo "Preparing patches directory for ${{ inputs.strategy }} strategy..."
        echo "Source patches directory: $PATCHES_SOURCE"
        
        # Create the patches directory that Kind will mount
        sudo mkdir -p /tmp/scheduler-patches
        
        # Copy the appropriate scheduler patch
        sudo cp "$PATCHES_SOURCE/kube-scheduler.yaml" /tmp/scheduler-patches/
        
        # Also copy the scheduler configuration file to the patches directory
        CONFIG_FILE="${{ github.action_path }}/configs/${{ inputs.strategy == 'MostAllocated' && 'most-allocated-config.yaml' || 'least-allocated-config.yaml' }}"
        sudo cp "$CONFIG_FILE" /tmp/scheduler-patches/scheduler-config.yaml
        
        echo "Prepared patches directory for Kind cluster with ${{ inputs.strategy }} strategy"
        echo "Patches directory contents:"
        ls -la /tmp/scheduler-patches/
        
        echo "Scheduler patch contents:"
        cat /tmp/scheduler-patches/kube-scheduler.yaml
        
        echo "Scheduler config contents:"
        cat /tmp/scheduler-patches/scheduler-config.yaml
        
        echo "Patches directory is ready for Kind cluster creation"
