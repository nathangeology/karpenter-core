name: InstallDependencies
description: 'Installs Go Downloads and installs Karpenter Dependencies'
inputs:
  k8sVersion:
    description: Kubernetes version to use when installing envtest binaries
    default: "1.36.x"
  cache:
    description: >-
      Whether this action may write caches. Pass "false" when the caller has
      checked out a ref it does not control. A workflow_run job's cache scope is
      the default branch, so a cache written after checking out a pull request's
      tree is a write into main's scope, and anything that later restores it runs
      what that tree produced. Defaults to "true", which keeps the push,
      presubmit, codeql and workflow_dispatch paths cached as before.
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      id: setup-go
      with:
        go-version-file: go.mod
        check-latest: true
        cache-dependency-path: "**/go.sum"
        cache: ${{ inputs.cache }}
    # Root path permission workaround for caching https://github.com/actions/cache/issues/845#issuecomment-1252594999
    - run: sudo chown "$USER" /usr/local
      shell: bash
    # Skipped rather than made read-only when cache is "false": actions/cache saves in a
    # post step, and there is no input that keeps the restore while dropping the save.
    # Skipping it leaves cache-hit unset, so the install step below runs and downloads
    # envtest. That costs seconds on the one path this affects.
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: cache-envtest
      with:
        path: /usr/local/kubebuilder/bin
        key: ${{ runner.os }}-${{ inputs.k8sVersion }}-envtest-cache
    - if: ${{ steps.cache-envtest.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        sudo mkdir -p /usr/local/kubebuilder
        go tool -modfile=go.tools.mod setup-envtest use -p path ${{ inputs.k8sVersion }} | xargs -I {} sudo mv {} /usr/local/kubebuilder/bin
