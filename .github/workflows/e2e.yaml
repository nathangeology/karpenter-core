name: e2e
on:
  workflow_call:
    inputs:
      k8s_version:
        type: string
        default: "1.35"
      suite:
        type: string
        required: true
      focus:
        type: string
        required: false
        description: "Ginkgo focus pattern to run specific tests"
      test_name:
        type: string
        required: false
        description: "Human-readable test name for job identification"
      pod_deletion_cost_enabled:
        type: string
        required: false
        default: "false"
        description: "Enable pod deletion cost management feature"
      pod_deletion_cost_ranking_strategy:
        type: string
        required: false
        default: "Random"
        description: "Ranking strategy: Random, LargestToSmallest, SmallestToLargest, UnallocatedVCPUPerPodCost"
      pod_deletion_cost_change_detection:
        type: string
        required: false
        default: "true"
        description: "Enable change detection optimization"
jobs:
  e2e:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    name: ${{ inputs.test_name || format('suite-{0}', inputs.suite) }}
    steps:
    - name: Debug workflow_run trigger
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
        echo "Workflow run name: ${{ github.event.workflow_run.name }}"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python 3.10
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.10"
    - uses: ./.github/actions/install-deps
      with:
          k8sVersion: ${{ inputs.k8s_version }}
    - name: Kind Cluster
      uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
    - name: check kind cluster and taint nodes
      shell: bash
      run: |
        kubectl config current-context
        kubectl get nodes
        kubectl taint nodes chart-testing-control-plane CriticalAddonsOnly:NoSchedule
    - name: install prometheus 
      uses: ./.github/actions/install-prometheus
    - name: install pyroscope 
      uses: ./.github/actions/install-pyroscope
    - name: install ko
      shell: bash
      run: |
        go install github.com/google/ko@latest      
    - name: install kwok and controller
      shell: bash
      env:
        POD_DELETION_COST_ENABLED: ${{ inputs.pod_deletion_cost_enabled }}
        POD_DELETION_COST_RANKING_STRATEGY: ${{ inputs.pod_deletion_cost_ranking_strategy }}
        POD_DELETION_COST_CHANGE_DETECTION: ${{ inputs.pod_deletion_cost_change_detection }}
      run: |
        make install-kwok
        export KWOK_REPO=kind.local
        export KIND_CLUSTER_NAME=chart-testing
        make apply-with-kind
    - name: ping cluster
      shell: bash
      run: | 
        sleep 15
        kubectl get pods -n kube-system | grep karpenter 
        kubectl get nodepools
        kubectl get pods -A
        kubectl describe nodes
    - name: Verify Karpenter configuration
      if: inputs.pod_deletion_cost_enabled == 'true'
      shell: bash
      run: |
        echo "Verifying pod deletion cost configuration..."
        echo "Expected configuration:"
        echo "  Feature enabled: ${{ inputs.pod_deletion_cost_enabled }}"
        echo "  Ranking strategy: ${{ inputs.pod_deletion_cost_ranking_strategy }}"
        echo "  Change detection: ${{ inputs.pod_deletion_cost_change_detection }}"
        echo ""
        
        # Wait for deployment to be ready
        kubectl wait --for=condition=available --timeout=60s deployment/karpenter -n kube-system
        
        # Get all environment variables from the deployment
        echo "Karpenter controller environment variables:"
        kubectl get deployment -n kube-system karpenter -o jsonpath='{.spec.template.spec.containers[0].env}' | jq '.'
        echo ""
        
        # Check feature gate
        FEATURE_GATES=$(kubectl get deployment -n kube-system karpenter -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="FEATURE_GATES")].value}')
        echo "FEATURE_GATES: $FEATURE_GATES"
        if [[ "$FEATURE_GATES" != *"PodDeletionCostManagement=true"* ]]; then
          echo "ERROR: Feature gate PodDeletionCostManagement is not enabled"
          echo "Expected: PodDeletionCostManagement=true"
          echo "Got: $FEATURE_GATES"
          exit 1
        fi
        echo "✓ Feature gate verified: PodDeletionCostManagement=true"
        
        # Check ranking strategy
        STRATEGY=$(kubectl get deployment -n kube-system karpenter -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="POD_DELETION_COST_RANKING_STRATEGY")].value}')
        echo "POD_DELETION_COST_RANKING_STRATEGY: $STRATEGY"
        if [[ "$STRATEGY" != "${{ inputs.pod_deletion_cost_ranking_strategy }}" ]]; then
          echo "ERROR: Ranking strategy mismatch"
          echo "Expected: ${{ inputs.pod_deletion_cost_ranking_strategy }}"
          echo "Got: $STRATEGY"
          exit 1
        fi
        echo "✓ Ranking strategy verified: $STRATEGY"
        
        # Check change detection
        CHANGE_DETECTION=$(kubectl get deployment -n kube-system karpenter -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="POD_DELETION_COST_CHANGE_DETECTION")].value}')
        echo "POD_DELETION_COST_CHANGE_DETECTION: $CHANGE_DETECTION"
        if [[ "$CHANGE_DETECTION" != "${{ inputs.pod_deletion_cost_change_detection }}" ]]; then
          echo "ERROR: Change detection setting mismatch"
          echo "Expected: ${{ inputs.pod_deletion_cost_change_detection }}"
          echo "Got: $CHANGE_DETECTION"
          exit 1
        fi
        echo "✓ Change detection verified: $CHANGE_DETECTION"
        
        echo ""
        echo "✓ All configuration checks passed successfully"
    - name: Verify pod annotations
      if: inputs.pod_deletion_cost_enabled == 'true'
      shell: bash
      run: |
        echo "Verifying pod deletion cost annotations..."
        echo "Waiting for pods to be annotated (30 seconds)..."
        sleep 30
        
        # Check for deletion cost annotations
        ANNOTATED_PODS=$(kubectl get pods -A -o json | jq '[.items[] | select(.metadata.annotations."controller.kubernetes.io/pod-deletion-cost" != null)] | length')
        echo "Found $ANNOTATED_PODS pods with deletion cost annotations"
        
        if [ "$ANNOTATED_PODS" -eq 0 ]; then
          echo "WARNING: No pods have deletion cost annotations yet"
          echo "This may be expected if no pods have been scheduled or if the controller hasn't processed them yet"
          echo ""
          echo "Current pod status:"
          kubectl get pods -A --no-headers | wc -l
          echo "total pods in cluster"
        else
          echo "✓ Pod annotations are being set"
          echo ""
          echo "Sample annotations (first 10 pods):"
          kubectl get pods -A -o json | jq -r '.items[] | select(.metadata.annotations."controller.kubernetes.io/pod-deletion-cost" != null) | "\(.metadata.namespace)/\(.metadata.name): \(.metadata.annotations."controller.kubernetes.io/pod-deletion-cost")"' | head -10
        fi
        
        echo ""
        echo "Pod annotation verification complete"
    - name: run the ${{ inputs.test_name || inputs.suite }} test
      env:
          SUITE: ${{ inputs.suite }}
          FOCUS: ${{ inputs.focus }}
      shell: bash
      run: |
        OUTPUT_DIR=$(mktemp -d)
        export OUTPUT_DIR
        echo OUTPUT_DIR="$OUTPUT_DIR" >> "$GITHUB_ENV"
        TEST_SUITE="$SUITE" make e2etests
    - name: Upload performance results
      if: always() && env.OUTPUT_DIR != ''
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: performance-results-${{ inputs.test_name || format('suite-{0}', inputs.suite) }}-${{ github.run_id }}
        path: ${{ env.OUTPUT_DIR }}/*_performance_report.json
        retention-days: 30
        if-no-files-found: ignore
    - name: cleanup 
      shell: bash
      run: | 
        kubectl delete nodepools --all 
        make delete
        make uninstall-kwok
