name: perf-gate
# Gathers one test's samples, aggregates them into batch statistics, and
# compares those against the stored baseline.
#
# This runs once per test after every sample job for that test has finished.
# It cannot be folded back into the sample job. Every sample of a run shares
# github.run_id, so N sample jobs would contend for one cache key, and
# actions/cache saves in a post step gated on success(), which would leave the
# last green writer to win non-deterministically. One gather job per test is
# one writer per test per run.
on:
  workflow_call:
    inputs:
      test_name:
        type: string
        required: true
        description: "Test whose samples to gather. Must match the sample jobs' test_name."
      iterations:
        type: number
        required: true
        description: "Number of sample jobs dispatched for this test."
      min_iterations:
        type: number
        required: false
        default: 0
        description: >-
          Quorum. Refuse to gate below this many samples. 0 means require all
          of them, which is the rule from when one runner produced the whole
          batch and is wrong now: the upstream per-job failure rate on this
          workflow is 19%, and 44% on Wide Deployments, so requiring all ten
          samples leaves a batch gateable 12% of the time on a typical key and
          0.3% on Wide Deployments.
jobs:
  perf-gate:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    name: ${{ inputs.test_name }} gate
    # Shared parameters for the four benchmark-action Compare steps below.
    # Per-step configuration is limited to: name suffix, tool, output file,
    # external-data path, alert threshold, and fail-on-alert.
    env:
      BENCH_NAME_PREFIX: Karpenter Performance (${{ inputs.test_name }})
      BENCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BENCH_CC_USERS: '@nathangeology'
      # Off, and it has to be. benchmark-action posts an alert to the commit
      # comment endpoint, which needs contents: write. This job grants
      # issues: write, so the first alert on any tier ends the step with
      # "Resource not accessible by integration" instead of the alert. That
      # defeats fail-on-alert: false on the informational tier, which then fails
      # the job on a noise spike, and it replaces the gating tiers' alert
      # message with a permissions error.
      #
      # Measured: run 35684679041, both gather jobs failed on the informational
      # CV step after it raised 9 alerts. The alternative fix is to grant
      # contents: write, which is a real privilege increase on a job that only
      # needs to read. summary-always already writes the same detail to the job
      # summary, where it needs no token at all.
      BENCH_COMMENT_ON_ALERT: 'false'
      BENCH_SUMMARY_ALWAYS: 'true'
      OUTPUT_DIR: ${{ github.workspace }}/perf-batch
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache-dependency-path: "**/go.sum"
    # Each sample job uploaded one artifact. download-artifact names each
    # downloaded directory after its artifact, so the batch arrives as one
    # directory per sample and the aggregator reads each as one sample. The
    # -iter- token keeps one test's prefix from matching a longer test name,
    # for example "Host Name Spreading" against "Host Name Spreading XL".
    - name: Download this test's samples
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: performance-results-${{ inputs.test_name }}-iter-*-${{ github.run_id }}
        path: ${{ env.OUTPUT_DIR }}
    # One cache blob for the four benchmark-action Compare steps below.
    # Each tier writes its baseline file under ./cache/<tier>/benchmark-data.json;
    # actions/cache save-post persists the whole ./cache tree.
    #
    # The key carries github.run_id so every run writes a new entry. Cache
    # entries are immutable, so a key that is constant across runs restores
    # run 1's blob forever and the baseline never advances past its first
    # sample. restore-keys walks back to the most recent entry for this test,
    # which is the baseline the Compare steps below need. The `--run-` token
    # keeps one test's prefix from matching a longer test name.
    #
    # actions/cache saves in a post step gated on success(), so only a run
    # whose gate came back green advances the baseline. A run that alerts does
    # not overwrite the comparison point it failed against.
    - name: Download previous benchmark data (all tiers)
      id: baseline-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ./cache
        key: ${{ runner.os }}-perf-benchmark-${{ inputs.test_name }}--run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-perf-benchmark-${{ inputs.test_name }}--run-
    # The baseline audit's state file is cached separately from the history it
    # audits. When the two shared one entry, an eviction took both, the record
    # of which keys had been gated came back empty, and every key reported as a
    # legitimate first seed: a green gate that compared nothing. Separate
    # entries mean losing the history alone produces the intended failure.
    - name: Download baseline audit state
      id: baseline-state-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ./baseline-state
        key: ${{ runner.os }}-perf-baseline-state-${{ inputs.test_name }}--run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-perf-baseline-state-${{ inputs.test_name }}--run-
    # Runs after the cache restores so it can audit the baseline it will be
    # compared against. BASELINE_DIR makes the aggregator check that every
    # gated key has stored history: keys with none are reported as seeded, and
    # keys the last green run gated on that have lost their history fail the
    # step. benchmark-action skips unmatched keys silently, so without this a
    # run with no baseline reports a green gate having compared nothing.
    # BASELINE_CACHE_HIT closes the remaining hole in the same check: a
    # restored history entry with no state file is an eviction, not a first run.
    - name: Aggregate and compare against baseline
      env:
        ITERATIONS: ${{ inputs.iterations }}
        MIN_ITERATIONS: ${{ inputs.min_iterations > 0 && inputs.min_iterations || inputs.iterations }}
        BASELINE_DIR: ./cache
        BASELINE_STATE_DIR: ./baseline-state
        BASELINE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-matched-key }}
      shell: bash
      run: |
        go run ./.github/scripts/perf-aggregate
    # The batch median regression alerts run below with fail-on-alert: true.
    # An additional CV entry is emitted per metric so a reviewer can see when
    # a batch's within-batch variance grows beyond its historical envelope.
    # It runs under fail-on-alert: false so a noise spike comments but does
    # not block the pipeline, which is the informational answer to Ryan's
    # PR#2994 variance question. benchmark-action persists CV entries in
    # the same cache format as the median entries; no cache-schema change
    # is required.
    #
    # The smaller-is-better group is split into two tiers by observed
    # per-metric CV so a single flat threshold does not force a choice
    # between too-tight (FP on Controller CPU / Duration jitter) and too-loose
    # (miss a real regression on stable metrics like Peak Memory or Final
    # Nodes). Tiers are static approximations of @ryan-mist's stddev-based
    # gate ask (PR#2994 comment 3961447028); a proper stddev-history gate
    # remains a follow-up per the assessment.
    - name: Compare smaller-is-better metrics (tight)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - smaller-tight
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-smaller-tight.json
        external-data-json-path: ./cache/smaller-tight/benchmark-data.json
        # Tight tier: Duration, Controller Peak Memory, Final Nodes.
        # Threshold unchanged at 150%.
        #
        # Duration's placement here is the open question. Measured across 5
        # upstream runs its CV is median 15% and max 54%, against median 5% for
        # Peak Memory and 2% for Final Nodes, and a split-half false-positive
        # rate of 8.8% against 0.0% for the other two. The noise is
        # phase-shaped rather than metric-shaped: three consolidation keys
        # produce every one of those exceedances while five scale-out and drift
        # keys produce none. Re-measuring against samples that are now
        # independent is what decides whether Duration needs its own tier, a
        # phase-scoped threshold, or neither.
        alert-threshold: '150%'
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare smaller-is-better metrics (loose)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - smaller-loose
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-smaller-loose.json
        external-data-json-path: ./cache/smaller-loose/benchmark-data.json
        # Loose tier: Controller CPU. Threshold is 150%, restored from 250%
        # after the 250% figure was tested against real data and failed.
        #
        # The 250% value rested on an assumption: that the controller-CPU
        # regression from PR#2671 (issue #2954) would show up here at the 3x
        # the customer reported, so any threshold under 3.0 would catch it.
        # That was never measured. It has now been measured, by replaying the
        # PR#2671 diff through this workflow on two branches that differ only
        # by that diff, 5 iterations per side. The largest Controller CPU
        # ratio it produces is 2.070 on the hostname topology-spreading
        # consolidation key, Mann-Whitney p=0.032, bootstrap 95% CI on the
        # ratio [1.03, 2.52]. Not 3.0. At 250% the gate did not fire on any
        # key; at 150% it fires on that key. Widening the tier to 250% is what
        # turned a detection into a miss. A second key, scale_out, moved 1.448
        # at p=0.008 and is still missed at 150%, which is the per-key
        # threshold argument rather than an argument for a lower flat value.
        #
        # Known limitation, not addressed here. HELM_OPTS caps the controller
        # at 2 cores, so the largest ratio this metric can ever report for a
        # key is 2.0 divided by that key's baseline. Keys whose baseline
        # already sits above 1.33 cores cannot reach 1.5x at all, so their
        # pass carries no information. Screening those keys out of the gate,
        # and adding a cumulative CPU-seconds metric that the core cap does
        # not clip, are both follow-ups.
        #
        # Consolidation Rounds is excluded from both smaller-tier gate files
        # (see main.go tierInformational); it lives only in the CV file below.
        alert-threshold: '150%'
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare bigger-is-better metrics
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - bigger-is-better
        # Utilization and efficiency-score metrics fail when they DROP,
        # so they must not share a group with latency/resource-cost metrics.
        tool: customBiggerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-bigger.json
        external-data-json-path: ./cache/bigger/benchmark-data.json
        alert-threshold: '150%'
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare batch CV (informational only)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - batch CV
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-cv.json
        external-data-json-path: ./cache/cv/benchmark-data.json
        # Threshold is a benchmark-action ratio: alert fires when the
        # current batch CV is >= 2x the previous batch CV for that metric.
        # Derived empirically from 15 push-triggered kind-perf-e2e runs on
        # kubernetes-sigs/karpenter@main between 2026-08-19 and 2026-09-02
        # (n=120 (sub-test, metric) samples): cross-metric P95 CV = 43%,
        # median CV = 3.8%, per-metric P95/median ratios span 1.7x-7x.
        # Setting threshold to 200% (2x) is the informational analog to
        # the 2 sigma heuristic in @ryan-mist's PR#2994 variance comment
        # (id 3857936029): it fires when a batch's within-batch variance
        # doubles vs. its prior baseline without gating the pipeline.
        #
        # What this number now measures has changed. Before the batch was
        # spread across runners it was within-cluster dispersion on one
        # degrading kind cluster, which is 0.2% to 3.9% of the total variance
        # of the thing the gate actually compares. It is now between-run
        # dispersion, the dominant term, so a doubling here is a real change in
        # the gate's noise floor rather than a change in one cluster's mood.
        alert-threshold: '200%'
        fail-on-alert: false
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Upload aggregated performance results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: performance-batch-${{ inputs.test_name }}-${{ github.run_id }}
        path: |
          ${{ env.OUTPUT_DIR }}/aggregated_summary.json
          ${{ env.OUTPUT_DIR }}/benchmark-results-smaller-tight.json
          ${{ env.OUTPUT_DIR }}/benchmark-results-smaller-loose.json
          ${{ env.OUTPUT_DIR }}/benchmark-results-bigger.json
          ${{ env.OUTPUT_DIR }}/benchmark-results-cv.json
          ./baseline-state/baseline-state.json
        retention-days: 30
        if-no-files-found: ignore
