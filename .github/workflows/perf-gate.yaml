name: perf-gate
# Gathers one test's samples, aggregates them into batch statistics, and
# compares those against the stored baseline.
#
# This runs once per test after every sample job for that test has finished.
# It cannot be folded back into the sample job. Every sample of a run shares
# github.run_id, so N sample jobs would contend for one cache key, and
# actions/cache saves in a post step gated on success(), which would leave the
# last green writer to win non-deterministically. One gather job per test is
# one writer per test per run.
on:
  workflow_call:
    inputs:
      test_name:
        type: string
        required: true
        description: "Test whose samples to gather. Must match the sample jobs' test_name."
      iterations:
        type: number
        required: true
        description: "Number of sample jobs dispatched for this test."
      min_iterations:
        type: number
        required: false
        default: 0
        description: >-
          Quorum. Refuse to gate below this many samples. 0 means require all
          of them, which is the rule from when one runner produced the whole
          batch and is wrong now: the upstream per-job failure rate on this
          workflow is 19%, and 44% on Wide Deployments, so requiring all ten
          samples leaves a batch gateable 12% of the time on a typical key and
          0.3% on Wide Deployments.
      allow_baseline_seed:
        type: boolean
        required: false
        default: false
        description: >-
          Permit a key declared gated by .github/perf-gate-keys.txt to be seeded
          when the stored history has none. A run with this set is not gating
          those keys, so it is false by default and set only when deliberately
          establishing a new cache scope. A scope nobody has ever written to is
          detected on its own and needs no flag; this covers the case where the
          cache entry or the audit state survived but the chart names moved.
jobs:
  perf-gate:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    name: ${{ inputs.test_name }} gate
    # Shared parameters for the benchmark-action steps below. Per-step
    # configuration is limited to: name suffix, tool, output file,
    # external-data path, alert threshold, and fail-on-alert.
    env:
      BENCH_NAME_PREFIX: Karpenter Performance (${{ inputs.test_name }})
      BENCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BENCH_CC_USERS: '@nathangeology'
      # Off, and it has to be. benchmark-action posts an alert to the commit
      # comment endpoint, which needs contents: write. This job grants
      # issues: write, so the first alert on any tier ends the step with
      # "Resource not accessible by integration" instead of the alert. That
      # defeats fail-on-alert: false on the informational tier, which then fails
      # the job on a noise spike, and it replaces the gating tiers' alert
      # message with a permissions error.
      #
      # Measured: run 35684679041, both gather jobs failed on the informational
      # CV step after it raised 9 alerts. The alternative fix is to grant
      # contents: write, which is a real privilege increase on a job that only
      # needs to read. summary-always already writes the same detail to the job
      # summary, where it needs no token at all.
      BENCH_COMMENT_ON_ALERT: 'false'
      BENCH_SUMMARY_ALWAYS: 'true'
      OUTPUT_DIR: ${{ github.workspace }}/perf-batch
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache-dependency-path: "**/go.sum"
    # Each sample job uploaded one artifact. download-artifact names each
    # downloaded directory after its artifact, so the batch arrives as one
    # directory per sample and the aggregator reads each as one sample. The
    # -iter- token keeps one test's prefix from matching a longer test name,
    # for example "Host Name Spreading" against "Host Name Spreading XL".
    - name: Download this test's samples
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: performance-results-${{ inputs.test_name }}-iter-*-${{ github.run_id }}
        path: ${{ env.OUTPUT_DIR }}
    # One cache blob for every benchmark-action step below. Each writes its
    # baseline file under ./cache/<field slug>/benchmark-data.json; actions/cache
    # save-post persists the whole ./cache tree.
    #
    # The key carries github.run_id so every run writes a new entry. Cache
    # entries are immutable, so a key that is constant across runs restores
    # run 1's blob forever and the baseline never advances past its first
    # sample. restore-keys walks back to the most recent entry for this test,
    # which is the baseline the Compare steps below need. The `--run-` token
    # keeps one test's prefix from matching a longer test name.
    #
    # actions/cache saves in a post step gated on success(), so only a run
    # whose gate came back green advances the baseline. A run that alerts does
    # not overwrite the comparison point it failed against.
    - name: Download previous benchmark data (all tiers)
      id: baseline-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ./cache
        key: ${{ runner.os }}-perf-benchmark-${{ inputs.test_name }}--run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-perf-benchmark-${{ inputs.test_name }}--run-
    # The baseline audit's state file is cached separately from the history it
    # audits. When the two shared one entry, an eviction took both, the record
    # of which keys had been gated came back empty, and every key reported as a
    # legitimate first seed: a green gate that compared nothing. Separate
    # entries mean losing the history alone produces the intended failure.
    - name: Download baseline audit state
      id: baseline-state-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ./baseline-state
        key: ${{ runner.os }}-perf-baseline-state-${{ inputs.test_name }}--run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-perf-baseline-state-${{ inputs.test_name }}--run-
    # Runs after the cache restores so it can audit the baseline it will be
    # compared against. BASELINE_DIR makes the aggregator check that every
    # gated key has stored history: keys with none are reported as seeded, and
    # keys the last green run gated on that have lost their history fail the
    # step. benchmark-action skips unmatched keys silently, so without this a
    # run with no baseline reports a green gate having compared nothing.
    # BASELINE_CACHE_HIT closes the remaining hole in the same check: a
    # restored history entry with no state file is an eviction, not a first run.
    - name: Aggregate and compare against baseline
      id: aggregate
      env:
        ITERATIONS: ${{ inputs.iterations }}
        MIN_ITERATIONS: ${{ inputs.min_iterations > 0 && inputs.min_iterations || inputs.iterations }}
        BASELINE_DIR: ./cache
        BASELINE_STATE_DIR: ./baseline-state
        BASELINE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-matched-key }}
        # The committed registry. It decides which keys reach a Compare step and
        # at what threshold, and it publishes both as step outputs so the numbers
        # below live in exactly one place. A key the batch produces and the
        # registry does not mention fails this step.
        GATE_KEYS_FILE: .github/perf-gate-keys.txt
        ALLOW_BASELINE_SEED: ${{ inputs.allow_baseline_seed }}
      shell: bash
      run: |
        go run ./.github/scripts/perf-aggregate
    # One Compare step per gated field. benchmark-action takes one
    # alert-threshold per step, so a field can only carry its own threshold by
    # getting its own step. The two shared tiers this replaced forced every
    # field in a tier to the loosest value any of its keys needed, which is how
    # a 1.04 key ended up gated at 1.50.
    #
    # Each step is identical apart from its field. name, tool, output file and
    # cache subdirectory all derive from the field's slug in main.go, and the
    # threshold and the run/skip decision come from the aggregate step's
    # outputs. Nothing below is a number a reviewer has to check against
    # anything else.
    #
    # The `if` skips a field with no gated key in this test. benchmark-action on
    # an empty array stores a history entry holding no keys, which a later run
    # reads as a baseline that legitimately has none. It also skips every step
    # when the aggregate step failed, because the outputs are then unset.
    - name: Compare Duration
      if: always() && steps.aggregate.outputs.gated_duration == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - duration
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-duration.json
        external-data-json-path: ./cache/duration/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_duration }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare Controller Peak Memory
      if: always() && steps.aggregate.outputs.gated_peak_memory == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - peak_memory
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-peak_memory.json
        external-data-json-path: ./cache/peak_memory/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_peak_memory }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    # Controller CPU is the one gated field with a ceiling. HELM_OPTS limits the
    # controller to 2 cores (Makefile:9), so the largest ratio a key can report
    # is 2.0 divided by its baseline. The aggregate step recomputes that per run
    # and screens any key whose threshold sits at or above it, because such a
    # key cannot fail however large the regression. The baseline is not stable
    # enough to tabulate: hostname_spread_consolidation reads 1.456 cores on the
    # fresh-runner batch, 0.752 in the positive control and 1.560 on upstream
    # main, which moves its ceiling from 1.37 to 2.66.
    - name: Compare Controller CPU
      if: always() && steps.aggregate.outputs.gated_controller_cpu == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - controller_cpu
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-controller_cpu.json
        external-data-json-path: ./cache/controller_cpu/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_controller_cpu }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare Final Nodes
      if: always() && steps.aggregate.outputs.gated_final_nodes == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - final_nodes
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-final_nodes.json
        external-data-json-path: ./cache/final_nodes/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_final_nodes }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    # Utilization and efficiency fail when they DROP, so they take the
    # bigger-is-better tool. Direction is a per-step property in
    # github-action-benchmark, not a per-entry one.
    - name: Compare CPU Utilization
      if: always() && steps.aggregate.outputs.gated_cpu_util == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - cpu_util
        tool: customBiggerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-cpu_util.json
        external-data-json-path: ./cache/cpu_util/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_cpu_util }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    # Dormant while the registry screens it. report.go:128 computes the
    # efficiency score as avgCPUUtil*90 + avgMemUtil*10, so it is a linear
    # combination of the two utilization fields above and carries no information
    # they do not. Gating it would also inflate the multiplicity count that sets
    # every other key's threshold. The step stays so that re-admitting the field
    # is a one-line registry change rather than a workflow change.
    - name: Compare Efficiency Score
      if: always() && steps.aggregate.outputs.gated_efficiency_score == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - efficiency_score
        tool: customBiggerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-efficiency_score.json
        external-data-json-path: ./cache/efficiency_score/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_efficiency_score }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare Memory Utilization
      if: always() && steps.aggregate.outputs.gated_memory_util == 'true'
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - memory_util
        tool: customBiggerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-memory_util.json
        external-data-json-path: ./cache/memory_util/benchmark-data.json
        alert-threshold: ${{ steps.aggregate.outputs.threshold_memory_util }}
        fail-on-alert: true
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    # The two observe-only steps carry the median of every key the registry
    # screens. A screened key still has to accumulate history and appear in the
    # chart: that is the whole difference between "screened, and here is the
    # series" and "silently absent", and it is what the `none` sentinel buys
    # over the silent skip it replaces.
    #
    # The threshold is set where nothing can reach it. These keys are screened
    # because their dispersion makes a relative alert meaningless, so an alert
    # on them would be noise a reader learns to ignore. The steps exist to
    # record, not to signal. fail-on-alert is false as well, so neither can
    # affect the gate under any threshold.
    - name: Record observed smaller-is-better keys (no gate)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - observed_smaller
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-observed_smaller.json
        external-data-json-path: ./cache/observed_smaller/benchmark-data.json
        alert-threshold: '10000%'
        fail-on-alert: false
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Record observed bigger-is-better keys (no gate)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - observed_bigger
        tool: customBiggerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-observed_bigger.json
        external-data-json-path: ./cache/observed_bigger/benchmark-data.json
        alert-threshold: '10000%'
        fail-on-alert: false
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Compare batch CV (informational only)
      if: always()
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ env.BENCH_NAME_PREFIX }} - batch CV
        tool: customSmallerIsBetter
        output-file-path: ${{ env.OUTPUT_DIR }}/benchmark-results-cv.json
        external-data-json-path: ./cache/cv/benchmark-data.json
        # Threshold is a benchmark-action ratio: alert fires when the
        # current batch CV is >= 2x the previous batch CV for that metric.
        # Derived empirically from 15 push-triggered kind-perf-e2e runs on
        # kubernetes-sigs/karpenter@main between 2026-08-19 and 2026-09-02
        # (n=120 (sub-test, metric) samples): cross-metric P95 CV = 43%,
        # median CV = 3.8%, per-metric P95/median ratios span 1.7x-7x.
        # Setting threshold to 200% (2x) is the informational analog to
        # the 2 sigma heuristic in @ryan-mist's PR#2994 variance comment
        # (id 3857936029): it fires when a batch's within-batch variance
        # doubles vs. its prior baseline without gating the pipeline.
        #
        # What this number now measures has changed. Before the batch was
        # spread across runners it was within-cluster dispersion, which is 0.2%
        # to 3.9% of the total variance of the thing the gate actually
        # compares. It is now between-run dispersion, the dominant term, so a
        # doubling here is a real change in the gate's noise floor rather than a
        # change in one cluster's mood.
        #
        # It is not a substitute for the censoring screen in the aggregate step.
        # A key that only ever records its own timeout has a 1.23% sample CV and
        # measures nothing, so no CV threshold can catch it.
        alert-threshold: '200%'
        fail-on-alert: false
        github-token: ${{ env.BENCH_TOKEN }}
        alert-comment-cc-users: ${{ env.BENCH_CC_USERS }}
        comment-on-alert: ${{ env.BENCH_COMMENT_ON_ALERT }}
        summary-always: ${{ env.BENCH_SUMMARY_ALWAYS }}
    - name: Upload aggregated performance results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: performance-batch-${{ inputs.test_name }}-${{ github.run_id }}
        path: |
          ${{ env.OUTPUT_DIR }}/aggregated_summary.json
          ${{ env.OUTPUT_DIR }}/benchmark-results-*.json
          ./baseline-state/baseline-state.json
        retention-days: 30
        if-no-files-found: ignore
