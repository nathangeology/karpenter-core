name: kind-perf-e2e
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows:
      - ApprovalComment
    types:
      - completed
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04-16core
  kind-perf-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        scheduler:
          - strategy: "LeastAllocated"
            name: "Default"
          - strategy: "MostAllocated"
            name: "MostAllocated"
        test:
          #          - name: "Drift Performance"
          #            focus: "Drift Performance"
          #          - name: "Host Name Spreading"
          #            focus: "Host Name Spreading Deployment Reg"
          #          - name: "Host Name Spreading XL"
          #            focus: "Host Name Spreading Deployment XL"
          #          - name: "Wide Deployments"
          #            focus: "Wide Deployments"
          - name: "Basic Scale Test"
            focus: "Basic Deployment"
          #          - name: "Do Not Disrupt Performance"
          #            focus: "Do Not Disrupt Performance Test"
          #          - name: "Provisioning"
          #            focus: "Provisioning"
          #          - name: "Self Anti-Affinity Deployment Interference"
          #            focus: "Self Anti-Affinity Deployment Interference"
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Performance
      focus: ${{ matrix.test.focus }}
      test_name: ${{ matrix.test.name }} (${{ matrix.scheduler.name }})
      scheduler_strategy: ${{ matrix.scheduler.strategy }}
