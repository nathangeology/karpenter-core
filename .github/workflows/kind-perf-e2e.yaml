name: kind-perf-e2e-ab
# EXPERIMENT ONLY, not for merge.
#
# A/B variant of kind-perf-e2e. Both arms of the comparison run as legs of ONE
# workflow run instead of two separate runs.
#
# Why. The prior detection measurement put the base arm in run 35680298794 and
# the carry-forward arm in run 35680365019. Run-level nuisance (runner-pool
# generation, queue depth, hosted-image drift) was therefore fully confounded
# with the treatment, and the between-run term carries 96% to 99.8% of total
# variance on the keys where it has been decomposed. Putting both arms in one
# run makes that term common to the arms rather than part of the contrast.
#
# The product code per arm comes from the `ref` input to e2e.yaml, which feeds
# actions/checkout. The orchestration is fixed at the run's own ref, so the two
# arms differ only in the three scheduling product files. Verified by md5 before
# launch: topology.go, topologydomaingroup.go, topologygroup.go.
#
# GitHub does not guarantee the dispatch order of matrix legs, so within-run
# adjacency cannot be forced from the workflow. Each leg records its runner CPU
# model and its start time, and the analysis pairs post hoc on start-time
# proximity within suite and blocks on CPU model.
on:
  workflow_dispatch:
    inputs:
      iterations:
        type: string
        required: false
        default: "20"
        description: "Samples per test PER ARM. Total legs = suites x this x 2."
      suites:
        type: string
        required: false
        default: "memory"
        description: "memory = the two memory-priority suites. all = all seven."
env:
  # Commit for each arm. Both are on this fork. base is the parent of cf, and
  # the only delta is the re-applied PR 2671 product diff.
  REF_BASE: "7ba981ede6ecc703d6199eb9d800f468966cb36b"
  REF_CF: "e1c33f94df7019179116e07aafce155cd0ad47ff"
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
    - name: build the interleaved A/B matrix
      id: plan
      env:
        REQUESTED: ${{ inputs.iterations }}
        SUITES: ${{ inputs.suites }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        n = int(os.environ.get("REQUESTED") or "20")
        if n < 1:
            raise SystemExit("iterations must be >= 1")
        which = (os.environ.get("SUITES") or "memory").strip()
        ALL = [
            ("Basic Scale Test", "Basic Deployment"),
            ("Self Anti-Affinity Deployment Interference", "Self Anti-Affinity Deployment Interference"),
            ("Drift Performance", "Drift Performance"),
            ("Host Name Spreading", "Host Name Spreading Deployment Reg"),
            ("Host Name Spreading XL", "Host Name Spreading Deployment XL"),
            ("Wide Deployments", "Wide Deployments"),
            ("Do Not Disrupt Performance", "Do Not Disrupt Performance Test"),
        ]
        # The two suites that carry the memory cells this run exists to test:
        # Basic Scale Test emits the scale_out key, Self Anti-Affinity emits
        # self_antiaffinity_scale_out_small.
        suites = ALL[:2] if which == "memory" else ALL
        arms = [("base", os.environ["REF_BASE"]), ("cf", os.environ["REF_CF"])]
        inc = []
        for i in range(1, n + 1):
            # Arm order alternates by iteration index so neither arm sits in a
            # fixed position in the expansion.
            order = arms if i % 2 == 1 else arms[::-1]
            for name, focus in suites:
                for side, ref in order:
                    inc.append({"name": name, "focus": focus,
                                "iteration": i, "side": side, "ref": ref})
        print("matrix=" + json.dumps({"include": inc}))
        print("legs=%d" % len(inc))
        PY
        echo "planned $(grep -o 'legs=[0-9]*' "$GITHUB_OUTPUT" | tail -1)"
  kind-perf-e2e:
    needs: plan
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Performance
      focus: ${{ matrix.focus }}
      test_name: ${{ matrix.name }}
      iteration: ${{ matrix.iteration }}
      side: ${{ matrix.side }}
      ref: ${{ matrix.ref }}
