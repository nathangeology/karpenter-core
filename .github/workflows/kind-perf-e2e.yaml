name: kind-perf-e2e-mde
# EXPERIMENT ONLY, NOT FOR MERGE.
#
# Interleaved injection A/B for calibrating the performance e2e's minimum
# detectable effect. Every arm of the comparison runs as a leg of ONE workflow
# run.
#
# Why one run. Run-level nuisance (runner-pool generation, queue depth, hosted
# image drift) is otherwise fully confounded with the treatment, and the
# between-run term carries 96% to 99.8% of total variance on the keys where it
# has been decomposed. One run makes that term common to the arms rather than
# part of the contrast. A prior two-run contrast drew 5 CPU models split
# 24/22, 8/7, 6/3, 2/3, 0/4 across arms and carried that whole difference with
# no standard-error term for it.
#
# Why env vars rather than refs. Every arm checks out the SAME commit and runs
# the SAME image. The arms differ only in the controller's environment, which
# selects the injection and its magnitude. Three consequences: the ko image
# layer cache is shared by every leg in the run, so the marginal cost of an arm
# is a test run rather than a build; there is no product-code delta to confound
# the contrast; and the clean arm is the same binary as the injected arm with
# the injection set to zero.
#
# The injection itself is compiled in only under the perf_inject build tag, set
# here and nowhere else. A default build selects pkg/perfinject/inject_off.go,
# whose two functions are empty and whose import list is empty.
#
# GitHub does not guarantee matrix leg dispatch order, so within-run adjacency
# cannot be forced from the workflow. Each leg records its runner CPU model and
# start time; the analysis pairs post hoc on start-time proximity within suite
# and blocks on CPU model.
on:
  workflow_dispatch:
    inputs:
      iterations:
        type: string
        required: false
        default: "5"
        description: "Samples per (suite, arm). Total legs = suites x arms x this."
      suites:
        type: string
        required: false
        default: "basic"
        description: "basic | basic+hns | xl | all"
      arms:
        type: string
        required: false
        default: '[{"label":"clean","env":{}}]'
        description: >-
          JSON list of arm specs. Each is {"label":str, "env":{NAME:VALUE},
          "helm":str optional, "thresholds":str optional}. label must be
          filename-safe. env is injected into the controller pod. helm is
          appended to the chart's --set list. thresholds is the value of
          KARPENTER_PERF_THRESHOLDS for the test process.
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
    - name: build the interleaved injection matrix
      id: plan
      env:
        REQUESTED: ${{ inputs.iterations }}
        SUITES: ${{ inputs.suites }}
        ARMS: ${{ inputs.arms }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, re
        n = int(os.environ.get("REQUESTED") or "5")
        if n < 1:
            raise SystemExit("iterations must be >= 1")
        which = (os.environ.get("SUITES") or "basic").strip()
        ALL = {
            "basic": ("Basic Scale Test", "Basic Deployment"),
            "hns": ("Host Name Spreading", "Host Name Spreading Deployment Reg"),
            "xl": ("Host Name Spreading XL", "Host Name Spreading Deployment XL"),
            "interference": ("Self Anti-Affinity Deployment Interference",
                             "Self Anti-Affinity Deployment Interference"),
            "drift": ("Drift Performance", "Drift Performance"),
            "wide": ("Wide Deployments", "Wide Deployments"),
            "dnd": ("Do Not Disrupt Performance", "Do Not Disrupt Performance Test"),
        }
        # Any single suite name from ALL is also a valid value, so a run can
        # target one suite without editing this table.
        SETS = {
            "basic": ["basic"],
            "basic+hns": ["basic", "hns"],
            "xl": ["xl"],
            "all": list(ALL),
        }
        SETS.update({k: [k] for k in ALL if k not in SETS})
        if which not in SETS:
            raise SystemExit("unknown suites value %r" % which)
        suites = [ALL[k] for k in SETS[which]]
        arms = json.loads(os.environ["ARMS"])
        if not arms:
            raise SystemExit("arms must be a non-empty list")
        for a in arms:
            if not re.fullmatch(r"[A-Za-z0-9_.-]+", a.get("label", "")):
                raise SystemExit("arm label %r is not filename-safe" % a.get("label"))
        inc = []
        for i in range(1, n + 1):
            # Rotate the arm order by iteration index so no arm sits in a fixed
            # position in the expansion. With more than two arms a reversal is
            # not enough: a rotation gives every arm every position.
            order = arms[i % len(arms):] + arms[:i % len(arms)]
            for name, focus in suites:
                for a in order:
                    inc.append({
                        "name": name,
                        "focus": focus,
                        "iteration": i,
                        "arm": a["label"],
                        "inject_env": json.dumps(a.get("env", {})),
                        "helm_extra": a.get("helm", ""),
                        "perf_thresholds": a.get("thresholds", ""),
                    })
        print("matrix=" + json.dumps({"include": inc}))
        print("legs=%d" % len(inc))
        PY
        echo "planned $(grep -o 'legs=[0-9]*' "$GITHUB_OUTPUT" | tail -1)"
  kind-perf-e2e:
    needs: plan
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Performance
      focus: ${{ matrix.focus }}
      test_name: ${{ matrix.name }}
      iteration: ${{ matrix.iteration }}
      arm: ${{ matrix.arm }}
      inject_env: ${{ matrix.inject_env }}
      helm_extra: ${{ matrix.helm_extra }}
      perf_thresholds: ${{ matrix.perf_thresholds }}
